[package]
name = "ottie-core"
version = "0.1.0"
description = "Download engine of the Ottie download manager: resumable, multi-connection HTTP downloads with speed limits"
keywords = ["download-manager", "downloader", "http", "resume"]
categories = ["network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
jiff = "0.2.38"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
# The policy that turns off the Mark of the Web (docs/decisions/0045).
windows-registry = "0.6.1"

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "io-std"] }
