[package]
name = "ottie-api"
version = "0.1.0"
description = "HTTP API (REST + WebSocket events) of the Ottie download manager"
keywords = ["download-manager", "api", "websocket"]
categories = ["network-programming", "web-programming::http-server"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
ottie-core = { path = "../core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
ts-rs = "12.0.1"

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.30.0"
