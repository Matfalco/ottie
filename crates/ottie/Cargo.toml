[package]
name = "ottie"
version = "0.1.0"
description = "Ottie, a cross-platform download manager: pause/resume, multi-connection downloads, speed limits (early development)"
readme = "../../README.md"
keywords = ["download-manager", "downloader", "http", "resume", "cli"]
categories = ["command-line-utilities", "network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
getrandom = "0.4.3"
ottie-api = { path = "../api", version = "0.1.0" }
ottie-core = { path = "../core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["time"] }
