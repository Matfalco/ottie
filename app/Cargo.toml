[package]
name = "ottie-app"
version = "0.1.0"
description = "Ottie's desktop app: a window on the daemon's web UI"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.6.0"
tauri-plugin-single-instance = "2.5.3"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-tungstenite = "0.30.0"

[target.'cfg(windows)'.dependencies]
# The taskbar's theme, for the tray icon's colour.
windows-registry = "0.6.1"
